[project]
name = "chimera-task1-project2"
version = "0.1.0"
description = "From-scratch CHIMERA-Agent Task 1 Blocks 1-5 implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "joblib>=1.4,<2",
    "mcp>=1.27,<2",
    "numpy>=2.2,<3",
    "pandas>=2.3,<4",
    "pydantic>=2.13.4,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
tabular = [
    "catboost>=1.2.8,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pandas-stubs>=2.3,<3",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_task1"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chimera_task1"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
